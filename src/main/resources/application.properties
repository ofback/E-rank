spring.application.name=E-rank
# JPA
spring.datasource.url=jdbc:mysql://localhost:3307/erank?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.main.banner-mode=off
spring.jpa.hibernate.ddl-auto=update

## Observability
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.properties.hibernate.format_sql=true

# Configurações do JWT
# Gere uma chave segura e longa (ex: online "base64 64 byte secret generator")
jwt.secret=SUA_CHAVE_SECRETA_ULTRA_LONGA_E_SEGURA_DE_64_BYTES_AQUI
jwt.expiration=86400000 # 24 horas em milissegundos